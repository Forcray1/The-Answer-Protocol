[package]
name = "database"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx    = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tokio   = { version = "1", features = ["full"] }
argon2  = "0.5"
uuid    = { version = "1", features = ["v4"] }
serde   = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
domain = { version = "0.1.0", path = "../domain" }
