world:
  name: "The Answer Protocol"
  npcs:
    - id: "SandMonster"
      name: "SandMonster"
      role: "enemy"
      sprite: "IdleSqueleton"
      combat_sprite: "Squelette"
      spawn_pos: [300, -200]
      scale: 0.8
      hp: 50
      damage: 1
      defense: 2
      exp_reward: 65
      respawn_time: 10
      dialogue: ["Grahhhh !"]

    - id: "Guard1"
      name: "guard"
      role: "None"
      sprite: "../skin/Guard"
      hp: 50
      dialogue:
        - "If you go through this gate you will enter the city"
      spawn_pos: [-150.0, 595.0]
      scale: 0.6

    - id: "Guard2"
      name: "guard"
      role: "None"
      sprite: "../skin/Guard"
      hp: 50
      dialogue:
        - "If you go through this gate you will enter the city"
      spawn_pos: [150.0, 595.0]
      scale: 0.6

    - id: "Guard3"
      name: "guard"
      role: "None"
      sprite: "../skin/Guard"
      hp: 50
      dialogue:
        - "Did you have an audience with the queen ?"
        - "I'll let you pass go on"
      spawn_pos: [-39.0, 339.0]
      scale: 0.6

    - id: "Guard4"
      name: "guard"
      role: "None"
      sprite: "../skin/Guard"
      hp: 50
      dialogue:
        - "Did you have an audience with the queen ?"
        - "I'll let you pass go on"
      spawn_pos: [139.0, 339.0]
      scale: 0.6

    - id: "Gragas"
      name: "Sir Gragas"
      role: "Quest_giver"
      sprite: "../skin/Chief1"
      hp: 50
      dialogue:
        - "Hey [name], I have something for you to do. ; There is trouble in the city and the queen is asking for someone strong so I recommended you. The temple has been taken by some kind of monster. Most of the informations are confidential but you need to hurry to the city. It's at the north east So go to the east first from here. Good luck and come back safe"
        - "So that's what they want you to do ? Their hopes are high I hope you can do it. Here you go, you should go the the Oasis in the south, it's at the south of the city, there's a shop there so you can get some equipment, good luck"
        - "You can go train north from here there is some monsters you could defeat"
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Queen"
      name: "The Queen"
      role: "Quest_giver"
      sprite: "../skin/Queen"
      hp: 60
      dialogue:
        - "You're the one Sir Gragas sent to help ?"
        - "I'm glad that you are here, we need your help. Before taking down the temple, you need to go look for our treasure, it has been stolen and taken to the cave in the south west."
        - "You succeeded to retrieve it ? Thank you, you're stronger than what Sir Gragas was telling us. Here is a pass to the temple. Be aware, there is a lot of monsters and our enemy is truly strong."
        - "Y-You did it ! Thank you so much. I don't know how to repay you."
      spawn_pos: [46.0, 406.0]
      scale: 0.6
      quest_dialogues:
        # Stage 0 — première rencontre, quête pas encore démarrée
        - quest_id: "main_quest"
          stage: 0
          lines:
            - "You're the one Sir Gragas sent to help ?"
            - "I'm glad that you are here, we need your help. Before taking down the temple, you need to go look for our treasure, it has been stolen and taken to the cave in the south west."
        # Stage 1 — FetchItem en cours, la reine attend le cimeterre
        - quest_id: "main_quest"
          stage: 1
          lines:
            - "I'm glad that you are here, we need your help. Before taking down the temple, you need to go look for our treasure, it has been stolen and taken to the cave in the south west."
        # Stage 2 — FetchItem accompli, attente de la mort du boss
        - quest_id: "main_quest"
          stage: 2
          lines:
            - "You succeeded to retrieve it ? Thank you, you're stronger than what Sir Gragas was telling us. Here is a pass to the temple. Be aware, there is a lot of monsters and our enemy is truly strong."
        # Stage 255 — quête terminée
        - quest_id: "main_quest"
          stage: 255
          lines:
            - "Y-You did it ! Thank you so much. I don't know how to repay you."

    - id: "Dory"
      name: "Dory"
      role: "Quest_giver"
      sprite: "../skin/Dory"
      hp: 50
      dialogue:
        - "Did you know I made this city ?"
        - "If you go check poiscapute on instagram I'll give you an item..."
        - "Thank you so much ! Here you go, it's for you."
        - "You little selfish peasant, nothing for you then..."
      spawn_pos: [0.0, 0.0]
      scale: 0.6
      quest_dialogues:
        # Stage 0 — premier contact, quête pas encore démarrée
        - quest_id: "quest_dory"
          stage: 0
          lines:
            - "Did you know I made this city ?"
            - "If you go check poiscapute on instagram I'll give you an item..."
          choices:
            - text: "I checked it out!"
              answer: "yes"
            - text: "Not interested."
              answer: "no"
        # Stage 1 — en attente de réponse (relance si le joueur re-parle)
        - quest_id: "quest_dory"
          stage: 1
          lines:
            - "Did you know I made this city ?"
            - "If you go check poiscapute on instagram I'll give you an item..."
          choices:
            - text: "I checked it out!"
              answer: "yes"
            - text: "Not interested."
              answer: "no"
        # Stage 255 — quête terminée, medaillon déjà donné
        - quest_id: "quest_dory"
          stage: 255
          lines:
            - "Thank you so much ! Here you go, it's for you."

    - id: "Oguzhan"
      name: "Oguzhan"
      role: "None"
      sprite: "../skin/Oguzhan"
      hp: 50
      dialogue:
        - "The temple can't be accessed because it's been taken by some monster."
        - "I'll go free it easily but I still have work to do..."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Soufiane"
      name: "Soufiane"
      role: "Quest_giver"
      sprite: "../skin/Soufiane"
      hp: 50
      dialogue:
        - "Do you know about Pocket monsters ? They are famous in my country."
        - "There is new merch, a sword has been released in the oasis of the south, if you go get it for me I'll give you something"
        - "Thank you so much, here you go. I bought it from a strange merchant a long time ago, you may have a better use for it than me."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Jamato"
      name: "Jamato"
      role: "Quest_giver"
      sprite: "../skin/Jamato"
      hp: 50
      dialogue:
        - "Don't tell anyone but I found a way to make armor. If you bring me 10 bones from the skeleton in the wild, I'll make one for you."
        - "Well played, here's for you. Don't tell anyone, I don't want to get too much attention..."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Fatih"
      name: "Fatih"
      role: "None"
      sprite: "../skin/Fatih"
      hp: 50
      dialogue:
        - "Did you know there's been massive leaks from the archives of the 42 country ? That's the height of irony, they're known for forming security guards."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Zek"
      name: "Zek"
      role: "Quest_giver"
      sprite: "../skin/Zek"
      hp: 50
      dialogue:
        - "This region is dangerous, take those healing potions. I will feel guilty if you die."
        - "Be aware, monsters here are strong."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Mage"
      name: "Mage"
      role: "None"
      sprite: "../skin/Mage"
      hp: 50
      dialogue:
        - "This cave has become really dangerous, stay on your guard in there."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Anwar"
      name: "Anwar"
      role: "None"
      sprite: "../skin/Anwar"
      hp: 50
      dialogue:
        - "Hi, I rule this Oasis. I've made good friends with influent people of the city so they gave me this land."
        - "There is a forge that sells goods here, you should go check it out."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Forgeon"
      name: "Forgeon"
      role: "None"
      sprite: "../skin/Forgeon"
      hp: 50
      dialogue:
        - "Welcome to our shop, take your time to look if something interests you."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Axel"
      name: "Axel"
      role: "None"
      sprite: "../skin/Axel"
      hp: 50
      dialogue:
        - "Did you know our borders extend way further than this ? If you come back later you may be able to explore it, but only if the devs work harder for transcendence."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Elyesa"
      name: "Elyesa"
      role: "None"
      sprite: "../skin/Elyesa"
      hp: 50
      dialogue:
        - "I'm working on some projects for the neighbouring city. If they accept my proposition, I may be creating something way bigger."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Remy"
      name: "Remy"
      role: "Quest_giver"
      sprite: "../skin/Remy"
      hp: 50
      dialogue:
        - "I've been stuck looking for diamond. Could you help me to get some ? I definitely need to grind to not be stuck here forever."
        - "Some sand monsters from here drop them."
      spawn_pos: [0.0, 0.0]
      scale: 0.6

    - id: "Final_boss"
      name: "blank"
      role: "enemy"
      sprite: "SandMonster"
      combat_sprite: "SandMonster"
      spawn_pos: [0.0, 0.0]
      scale: 1.2
      hp: 300
      damage: 20
      defense: 8
      exp_reward: 500
      respawn_time: 9999
      dialogue: ["..."]

  items:
    - id: "Excalibur"
      name: "Excalibur"
      damage: 999
      slot: "weapon"
      obtainable: true
      description: "A legendary sword."
      sprite: "sword/Excalibur"
    - id: "Dague"
      name: "Dague"
      damage: 1
      slot: "weapon"
      obtainable: true
      description: "Simple dague"
    - id: "urbosas_cimeter"
      name: "Urbosa's Cimeter"
      obtainable: true
      type: "quest"
      description: "A sacred blade stolen from the royal treasury. The Queen needs it back."
      sprite: "sword_icone"
    - id: "magical_strength_medaillon"
      name: "Magical Strength Medaillon"
      obtainable: true
      type: "quest"
      slot: "medaillon"
      description: "A mysterious medaillon that radiates magical power. Dory gave it to you as a reward."
      sprite: "QuestUI"
  quests:
    - id: "main_quest"
      name: "The Answer Protocol"
      description: "Help the Queen reclaim the royal treasure and defeat the evil that has taken the temple."
      giver_id: "Queen"
      objective:
        type: talk_to_npc
        npc: "Queen"
      stages:
        - stage: 1
          objective:
            type: fetch_item
            item: "urbosas_cimeter"
        - stage: 2
          objective:
            type: kill_mob
            npc: "Final_boss"
            count: 1
      reward_exp: 1000
    - id: "quest_dory"
      name: "Dory's Gift"
      description: "Did you know Dory made this city? Check poiscapute on instagram and he might give you something."
      giver_id: "Dory"
      objective:
        type: talk_to_npc
        npc: "Dory"
      stages:
        - stage: 1
          objective:
            type: answer_dialogue
            npc: "Dory"
            expected_answer: "yes"
          on_wrong_answer:
            dialogue:
              - "You little selfish peasant, nothing for you then..."
            reset: true
      reward_item: "magical_strength_medaillon"
      reward_exp: 50
