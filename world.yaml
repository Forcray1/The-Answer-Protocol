  quests:
  - id: main_quest
    name: The Answer Protocol
    description: Help the Queen reclaim the royal treasure and defend the temple.
    giver_id: Queen
    objective:
      type: talk_to_npc
      npc: Queen
    stages:
    - stage: 1
      objective:
        type: fetch_item
        item: graal
    reward_item: urbosas_cimeter
    reward_items:
    - temple_pass
    reward_exp: 1000
  - id: quest_dragon_eye
    name: Temple Threat
    description: Defeat the dragon in the temple and bring proof back to the Queen.
    giver_id: Queen
    objective:
      type: talk_to_npc
      npc: Queen
    stages:
    - stage: 1
      objective:
        type: kill_mob
        npc: Drake
        count: 1
    reward_exp: 500
  - id: quest_dory
    name: Dory's Gift
    description: Did you know Dory made this city? Check poiscapute on instagram and he might give you something.
    giver_id: Dory
    objective:
      type: talk_to_npc
      npc: Dory
    stages:
    - stage: 1
      objective:
        type: answer_dialogue
        npc: Dory
        expected_answer: yes
      on_wrong_answer:
        dialogue:
        - You little selfish peasant, nothing for you then...
        reset: true
    reward_item: magical_strength_medaillon
    reward_exp: 50
  - id: quest_gragas
    name: Sir Gragas' Errand
    description: Sir Gragas sent you to the Queen in the city. Go see her, then report back to him.
    giver_id: Gragas
    objective:
      type: talk_to_npc
      npc: Gragas
    stages:
    - stage: 1
      objective:
        type: talk_to_npc
        npc: Queen
    - stage: 2
      objective:
        type: talk_to_npc
        npc: Gragas
    reward_gold: 200
  - id: quest_soufiane
    name: Soufiane's Merch
    description: Soufiane collects Pocket Monsters merch. Bring him the PM Sword from the oasis in the south and he will give you something in return.
    giver_id: Soufiane
    objective:
      type: deliver_item
      item: PMsword
      to: Soufiane
    reward_item: strength_medaillon
  - id: quest_jamato
    name: Jamato's Armor
    description: Jamato found a way to make armor. Bring him 10 bones from the skeletons in the wild.
    giver_id: Jamato
    objective:
      type: deliver_items
      items:
      - bone
      - bone
      - bone
      - bone
      - bone
      - bone
      - bone
      - bone
      - bone
      - bone
      to: Jamato
    reward_item: bone_armor
  - id: quest_remy
    name: Remy's Diamonds
    description: Remy is stuck looking for diamonds. Bring him 4 of them, the sand monsters drop them.
    giver_id: Remy
    objective:
      type: deliver_items
      items:
      - diamond
      - diamond
      - diamond
      - diamond
      to: Remy
    reward_items:
    - xp_medaillon
    reward_exp: 250
  - id: quest_zek
    name: Zek's Potions
    description: Zek hands out healing potions to travelers of the region.
    giver_id: Zek
    objective:
      type: talk_to_npc
      npc: Zek
    reward_items:
    - healing_potion
    - healing_potion
    - healing_potion
