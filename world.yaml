  - id: Gragas
    name: Sir Gragas
    description: Veteran guide sending travelers to help the queen.
    role: Quest_giver
    sprite: ../skin/Chief1
    hp: 50
    dialogue:
    - Hey, I have something for you to do.
    - There is trouble in the city and the queen is asking for someone strong so I recommended you. The temple has been taken by some kind of monster. Most of the informations are confidential but you need to hurry to the city. It's at the north east So go to the east first from here. Good luck and come back safe
    - So that's what they want you to do ? Their hopes are high I hope you can do it. Here you go, you should go the the Oasis in the south, it's at the south of the city, there's a shop there so you can get some equipment, good luck
    - You can go train north from here there is some monsters you could defeat
    spawn_pos:
    - -275.0
    - 474.0
    scale: 0.6
    quest_dialogues:
    - quest_id: quest_gragas
      stage: 0
      lines:
      - Hey, I have something for you to do.
      - There is trouble in the city and the queen is asking for someone strong so I recommended you. The temple has been taken by some kind of monster. Most of the informations are confidential but you need to hurry to the city. It's at the north east So go to the east first from here. Good luck and come back safe
    - quest_id: quest_gragas
      stage: 1
      lines:
      - Have you been to see the Queen yet ? She is in the city, at the north east. Go to the east first from here, then come back and tell me what she wants.
    - quest_id: quest_gragas
      stage: 254
      lines:
      - So that's what they want you to do ? Their hopes are high I hope you can do it. Here you go, you should go the the Oasis in the south, it's at the south of the city, there's a shop there so you can get some equipment, good luck
    - quest_id: quest_gragas
      stage: 255
      lines:
      - You can go train north from here there is some monsters you could defeat
  - id: Queen
    name: The Queen
    description: Ruler of the city, asking for help against the temple threat.
    role: Quest_giver
    sprite: ../skin/Queen
    hp: 60
    dialogue:
    - You're the one Sir Gragas sent to help ?
    - I'm glad that you are here, we need your help. Before taking down the temple, you need to go look for our treasure, it has been stolen and taken to the cave in the south west.
    - You succeeded to retrieve it ? Thank you, you're stronger than what Sir Gragas was telling us. Here is a pass to the temple. Be aware, there is a lot of monsters and our enemy is truly strong.
    - Y-You did it ! Thank you so much. I don't know how to repay you.
    spawn_pos:
    - 46.0
    - 406.0
    scale: 0.6
    quest_dialogues:
    - quest_id: main_quest
      stage: 0
      lines:
      - You're the one Sir Gragas sent to help ?
      - I'm glad that you are here, we need your help. Before taking down the temple, you need to go look for our treasure, it has been stolen and taken to the cave in the south west.
    - quest_id: main_quest
      stage: 1
      lines:
