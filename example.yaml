world:
  name: "The Answer Protocol - Quest Examples"

  npcs:
    - id: "Bob"
      name: "Bob"
      role: "quest_giver"
      hp: 100
      dialogue:
        - "Bonjour aventurier."
        - "Tu peux m'aider ?"
      sprite: "Merchant"
      spawn_pos: [0.0, 0.0]
      scale: 1.0

    - id: "Guard"
      name: "Garde du village"
      role: "quest_giver"
      hp: 80
      dialogue:
        - "Bienvenue dans le village."
        - "J'ai besoin de ton aide."
      sprite: "Guard"
      spawn_pos: [50.0, 10.0]
      scale: 1.0

    - id: "Goblin"
      name: "Goblin"
      role: "enemy"
      hp: 60
      damage: 8
      defense: 2
      exp_reward: 30
      respawn_time: 20
      dialogue:
        - "Grrr!"
      sprite: "Goblin"
      spawn_pos: [200.0, -80.0]
      scale: 1.2

  items:
    - id: "Herb"
      name: "Herbe médicinale"
      description: "Une herbe rare qui pousse dans les forêts."
      obtainable: true
      type: "quest"

    - id: "Crystal"
      name: "Cristal bleu"
      description: "Un cristal lumineux utilisé dans les rituels."
      obtainable: true
      type: "quest"

    - id: "Sword"
      name: "Épée simple"
      description: "Une épée classique donnée à l'aventurier."
      obtainable: true
      type: "standard"
      slot: "weapon"
      damage: 12

    - id: "VillageKey"
      name: "Clé du village"
      description: "Clé remise par le garde."
      obtainable: true
      type: "quest"

    - id: "Potion"
      name: "Potion de soin"
      description: "Restaure quelques points de vie."
      obtainable: true
      type: "standard"

  quests:
    # 1) Quête de type "Tuer un PNJ / monstre"
    - id: "quest_kill_goblin"
      name: "Nettoyer la forêt"
      description: "Tuer le goblin qui terrorise le village."
      giver_id: "Bob"
      objective:
        type: "defeat_npc"
        npc: "Goblin"
      target_id: "Goblin"
      reward_exp: 100
      reward_item: "Potion"

    # 2) Quête de type "Récupérer un objet"
    - id: "quest_fetch_herb"
      name: "Chercheur de plantes"
      description: "Apporte l'herbe médicinale à Bob."
      giver_id: "Bob"
      objective:
        type: "fetch_item"
        item: "Herb"
      target_id: "Herb"
      reward_exp: 60
      reward_item: "Sword"

    # 3) Quête de type "Livrer un objet à un PNJ"
    - id: "quest_deliver_crystal"
      name: "Le cristal perdu"
      description: "Ramène le cristal au garde du village."
      giver_id: "Guard"
      objective:
        type: "deliver_item"
        item: "Crystal"
        to: "Guard"
      target_id: "Crystal"
      reward_exp: 80
      reward_item: "VillageKey"

    # 4) Quête de type "Ramener plusieurs objets"
    - id: "quest_collect_two_items"
      name: "Les ingrédients du remède"
      description: "Apporte l'herbe et le cristal au guérisseur." 
      giver_id: "Bob"
      objective:
        type: "collect_items"
        items: ["Herb", "Crystal"]
      target_id: "Herb"
      reward_exp: 140
      reward_item: "Potion"

    # 5) Quête de type "Parler à un PNJ"
    - id: "quest_talk_to_guard"
      name: "Rencontre avec le garde"
      description: "Dis bonjour au garde du village."
      giver_id: "Bob"
      objective:
        type: "talk_to_npc"
        npc: "Guard"
      target_id: "Guard"
      reward_exp: 50
      reward_item: null

  locations:
    Village:
      name: "Village"
      description: "Le village de départ."
      exits:
        east: "Foret"
      npcs: ["Bob", "Guard"]
      items: ["Herb", "Crystal"]

    Foret:
      name: "Forêt"
      description: "Une forêt dense et dangereuse."
      exits:
        west: "Village"
      npcs: ["Goblin"]
      items: []
