[package]
name = "serveur"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
chrono = "0.4"
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
sqlx = { version = "0.7", features = ["sqlite"] }
database = { version = "0.1.0", path = "../database" }
